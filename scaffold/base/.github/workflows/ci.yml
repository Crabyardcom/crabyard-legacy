name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        if: "'{{PACKAGE_MANAGER}}' == 'bun'"
      - run: corepack enable
        if: "'{{PACKAGE_MANAGER}}' == 'pnpm' || '{{PACKAGE_MANAGER}}' == 'yarn'"
      - name: Install dependencies
        run: node scripts/install.mjs
      - name: Typecheck, lint, test, and build
        run: {{PM_RUN}} check

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        if: "'{{PACKAGE_MANAGER}}' == 'bun'"
      - run: corepack enable
        if: "'{{PACKAGE_MANAGER}}' == 'pnpm' || '{{PACKAGE_MANAGER}}' == 'yarn'"
      - run: node scripts/install.mjs
      - run: {{PM_RUN}} build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Compile desktop application
        run: {{PM_RUN}} tauri build --no-bundle
