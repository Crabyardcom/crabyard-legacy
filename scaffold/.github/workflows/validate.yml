name: Generated app matrix
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        auth: [none, github, google]
        ui: [minimal, shadcn, daisyui, tesign]
    steps:
      - uses: actions/checkout@v4
        with:
          path: templates
      - uses: actions/checkout@v4
        with:
          repository: Crabyardcom/crabyard-cli
          path: cli
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - uses: oven-sh/setup-bun@v2
      - name: Generate without host changes
        env:
          AUTH: ${{ matrix.auth }}
          UI: ${{ matrix.ui }}
        run: cargo run --locked --manifest-path cli/Cargo.toml -- new "Matrix App" --auth "$AUTH" --ui "$UI" --pm bun --template templates --output generated --yes --no-install --no-git
      - run: bun install
        working-directory: generated
      - run: bun run check
        working-directory: generated
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: templates
      - uses: actions/checkout@v4
        with:
          repository: Crabyardcom/crabyard-cli
          path: cli
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo run --locked --manifest-path cli/Cargo.toml -- new "Desktop Check" --auth github --ui shadcn --pm bun --template templates --output generated --yes --no-install --no-git
      - run: bun install
        working-directory: generated
      - run: bun run build
        working-directory: generated
      - run: bun run tauri icon src-tauri/app-icon.png
        working-directory: generated
      - run: cargo test --manifest-path generated/src-tauri/Cargo.toml
